<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

    <!-- Global styles -->
    <link rel="stylesheet" href="global.css" />

    <!-- Mapbox GL JS CSS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <!-- Map / D3 code -->
    <script src="map.js" type="module"></script>
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>🚴🏼‍♀️ Bikewatching</h1>
        <p class="subtitle">
          Bike lanes (Boston &amp; Cambridge) + Bluebikes stations sized by traffic,
          colored by net flow. Use the time slider to filter arrivals/departures.
        </p>
      </div>

      <label class="time-filter">
        <span>Filter by time:</span>
        <input
          id="time-slider"
          type="range"
          min="-1"
          max="1440"
          value="-1"
          step="15"
        />
        <time id="selected-time"></time>
        <em id="any-time">(any time)</em>
      </label>
    </header>

    <main>
      <div id="map">
        <!-- SVG overlay for D3 markers -->
        <svg></svg>
      </div>

      <div class="legend">
        <div class="legend-title">Traffic flow</div>
        <div class="legend-items">
          <div style="--departure-ratio: 1">
            <span class="swatch"></span>
            <span>More departures</span>
          </div>
          <div style="--departure-ratio: 0.5">
            <span class="swatch"></span>
            <span>Balanced</span>
          </div>
          <div style="--departure-ratio: 0">
            <span class="swatch"></span>
            <span>More arrivals</span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
