<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>🚲 Bikewatching — Lab 7</title>

    <!-- Global styles -->
    <link rel="stylesheet" href="global.css" />

    <!-- Mapbox GL JS -->
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <script
      src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"
      defer
    ></script>

    <!-- ES module for the map logic -->
    <script type="module" src="map.js" defer></script>

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header>
      <h1>🚲 Bikewatching</h1>
      <p>
        Bike lanes (Boston &amp; Cambridge) + Bluebikes stations sized by traffic,
        colored by net flow. Use the time slider to filter arrivals/departures.
      </p>
    </header>

    <section class="controls">
      <label>
        Filter by time:
        <input
          id="time-slider"
          type="range"
          min="-1"
          max="1440"
          value="-1"
          step="1"
        />
        <time id="time-label"></time>
        <em id="anytime">(any time)</em>
      </label>

      <div class="legend" id="legend"></div>
    </section>

    <div id="map"></div>

    <!-- Tooltip shell (not heavily used, but available if you extend) -->
    <dl id="commit-tooltip" class="info tooltip" hidden></dl>
  </body>
</html>
